<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BloodBridge - Blood Request</title>

    <link rel="stylesheet" href="style.css">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#b71c1c">
</head>

<body>

<header>
    <h1>🩸 BloodBridge</h1>
    <p>Blood Request</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="register.html">Register</a>
    <a href="request.html">Request</a>
    <a href="camp.html">Camps</a>
    <a href="contact.html">Contact</a>
    <a href="login.html">Login</a>
    <a href="search.html">Search</a>
    <a href="donors.html">Donors</a>
</nav>


<section>

    <h2>🩸 Request Blood</h2>

    <p>
        Enter the details of the person who needs blood.
    </p>


    <form id="requestForm">

        <!-- Patient Name -->

        <label for="patientName">
            Patient Name
        </label>

        <input
            type="text"
            id="patientName"
            placeholder="Enter patient name"
            required
        >


        <!-- Blood Group -->

        <label for="bloodGroup">
            Required Blood Group
        </label>

        <select id="bloodGroup" required>

            <option value="">
                Select blood group
            </option>

            <option value="A+">A+</option>
            <option value="A-">A-</option>

            <option value="B+">B+</option>
            <option value="B-">B-</option>

            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>

            <option value="O+">O+</option>
            <option value="O-">O-</option>

        </select>


        <!-- Location -->

        <label for="location">
            Location
        </label>

        <input
            type="text"
            id="location"
            placeholder="Enter city / area"
            required
        >


        <!-- Hospital -->

        <label for="hospital">
            Hospital / Medical Center
        </label>

        <input
            type="text"
            id="hospital"
            placeholder="Enter hospital name"
            required
        >


        <!-- Units -->

        <label for="units">
            Required Units
        </label>

        <input
            type="number"
            id="units"
            min="1"
            max="20"
            placeholder="Example: 2"
            required
        >


        <!-- Contact -->

        <label for="contact">
            Contact Number
        </label>

        <input
            type="tel"
            id="contact"
            placeholder="Enter contact number"
            required
        >


        <!-- Urgency -->

        <label for="urgency">
            Urgency
        </label>

        <select id="urgency" required>

            <option value="">
                Select urgency
            </option>

            <option value="Normal">
                🟢 Normal
            </option>

            <option value="Urgent">
                🟠 Urgent
            </option>

            <option value="Emergency">
                🔴 Emergency
            </option>

        </select>


        <!-- Submit -->

        <button type="submit">
            🩸 Submit Blood Request
        </button>

    </form>


    <h3 id="message"></h3>

</section>


<footer>

    <p>
        BloodBridge ❤️ Connecting Donors with Those in Need
    </p>

</footer>


<script>

document
    .getElementById("requestForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        // Get values

        const patientName =
            document.getElementById("patientName")
            .value.trim();

        const bloodGroup =
            document.getElementById("bloodGroup")
            .value;

        const location =
            document.getElementById("location")
            .value.trim();

        const hospital =
            document.getElementById("hospital")
            .value.trim();

        const units =
            document.getElementById("units")
            .value;

        const contact =
            document.getElementById("contact")
            .value.trim();

        const urgency =
            document.getElementById("urgency")
            .value;


        // Create request

        const request = {

            id: Date.now(),

            patientName: patientName,

            bloodGroup: bloodGroup,

            location: location,

            hospital: hospital,

            units: units,

            contact: contact,

            urgency: urgency,

            status: "Active",

            date: new Date().toLocaleString()

        };


        // Get existing requests

        let requests =
            JSON.parse(
                localStorage.getItem(
                    "bloodBridgeRequests"
                )
            ) || [];


        // Add new request

        requests.push(request);


        // Save requests

        localStorage.setItem(
            "bloodBridgeRequests",
            JSON.stringify(requests)
        );


        // Success message

        alert(
            "Blood request submitted successfully!"
        );


        // Clear form

        document
            .getElementById("requestForm")
            .reset();


        // Show message

        document
            .getElementById("message")
            .innerText =
            "✅ Your blood request has been submitted.";


    });


// Service worker

if ("serviceWorker" in navigator) {

    navigator.serviceWorker.register(
        "service-worker.js"
    );

}

</script>

</body>
</html>
