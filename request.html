<section>

    <h2>🩸 Request Blood</h2>

    <p>
        Enter the details of the person who needs blood.
    </p>

    <form id="requestForm">

        <label for="patientName">
            Patient Name
        </label>

        <input
            type="text"
            id="patientName"
            placeholder="Enter patient name"
            required
        >

        <label for="bloodGroup">
            Required Blood Group
        </label>

        <select id="bloodGroup" required>

            <option value="">
                Select blood group
            </option>

            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>

        </select>

        <label for="location">
            Location
        </label>

        <input
            type="text"
            id="location"
            placeholder="Enter city / area"
            required
        >

        <label for="hospital">
            Hospital / Medical Center
        </label>

        <input
            type="text"
            id="hospital"
            placeholder="Enter hospital name"
            required
        >

        <label for="units">
            Required Units
        </label>

        <input
            type="number"
            id="units"
            min="1"
            max="20"
            placeholder="Example: 2"
            required
        >

        <label for="contact">
            Contact Number
        </label>

        <input
            type="tel"
            id="contact"
            placeholder="Enter contact number"
            required
        >

        <label for="urgency">
            Urgency
        </label>

        <select id="urgency" required>

            <option value="">
                Select urgency
            </option>

            <option value="Normal">
                🟢 Normal
            </option>

            <option value="Urgent">
                🟠 Urgent
            </option>

            <option value="Emergency">
                🔴 Emergency
            </option>

        </select>

        <button type="submit">
            🩸 Submit Blood Request
        </button>

    </form>

    <div id="message"></div>

</section>


<section id="matchSection" style="display:none;">

    <h2>🔎 Matching Donors</h2>

    <div id="matchingDonors"></div>

</section>


<footer>

    <p>
        BloodBridge ❤️ Connecting Donors with Those in Need
    </p>

</footer>
