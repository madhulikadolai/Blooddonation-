<!DOCTYPE html>
<html>
<head>
<title>Request Blood</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>🩸 Blood Request</h1>
</header>

<nav>
<a href="index.html">Home</a>
<a href="register.html">Register</a>
<a href="request.html">Request</a>
<a href="camp.html">Camps</a>
<a href="contact.html">Contact</a>
<a href="login.html">Login</a>
<a href="search.html">Search</a>
<a href="donors.html">Donors</a>
</nav>

<section>

<h2>Request Blood</h2>

<form id="requestForm">

<input type="text" placeholder="Patient Name" required>

<select required>
<option value="">Blood Group Needed</option>
<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
<option>O+</option>
<option>O-</option>
</select>

<input type="text" placeholder="Hospital Name" required>

<input type="text" placeholder="City" required>

<input type="tel" placeholder="Contact Number" required>

<button type="submit">Request Blood</button>

</form>

<h3 id="requestMessage"></h3>

</section>

<footer>
<p>Every drop counts ❤️</p>
</footer>

<script>
document.getElementById("requestForm").addEventListener("submit", function(e){
e.preventDefault();
document.getElementById("requestMessage").innerHTML =
"✅ Your blood request has been submitted successfully.";
this.reset();
});
</script>

</body>
</html>
