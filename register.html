<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donor Registration</title>

    <link rel="stylesheet" href="style.css">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#b71c1c">
</head>

<body>

<header>
    <h1>🩸 Blood Donor Registration</h1>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="register.html">Register</a>
    <a href="request.html">Request</a>
    <a href="camp.html">Camps</a>
    <a href="contact.html">Contact</a>
    <a href="login.html">Login</a>
    <a href="search.html">Search</a>
    <a href="donors.html">Donors</a>
</nav>

<section>

    <h2>Register as a Donor</h2>

    <form id="registerForm">

        <label for="name">Full Name</label>
        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required
        >

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label for="phone">Phone Number</label>
        <input
            type="tel"
            id="phone"
            placeholder="Enter your phone number"
            required
        >

        <label for="bloodGroup">Blood Group</label>
        <select id="bloodGroup" required>
            <option value="">Select blood group</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
        </select>

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="Create a password"
            required
        >

        <label for="confirmPassword">Confirm Password</label>
        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            required
        >

        <button type="submit">Register</button>

    </form>

    <h3 id="message"></h3>

</section>

<footer>
    <p>Thank you for becoming a lifesaver ❤️</p>
</footer>


<script>
document.getElementById("registerForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const bloodGroup = document.getElementById("bloodGroup").value;
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    // Check passwords
    if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
    }

    // Create user
    const user = {
        name: name,
        email: email,
        phone: phone,
        bloodGroup: bloodGroup,
        password: password
    };

    // Save user
    localStorage.setItem("bloodBridgeUser", JSON.stringify(user));
// Save donor to donor list
let donors = JSON.parse(localStorage.getItem("bloodBridgeDonors")) || [];

donors.push({
    name: name,
    email: email,
    phone: phone,
    bloodGroup: bloodGroup
});

localStorage.setItem("bloodBridgeDonors", JSON.stringify(donors));
    // Save login status
    localStorage.setItem("bloodBridgeLoggedIn", "false");

    alert("Registration successful! Please login.");

    window.location.href = "login.html";
});


// Register service worker
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
