<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BloodBridge - Login</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#b71c1c">
</head>

<body>

    <header>
        <h1>🩸 BloodBridge</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
            <a href="request.html">Request Blood</a>
            <a href="donors.html">Donors</a>
            <a href="camp.html">Camps</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section class="form-container">

            <h2>Login</h2>
            <p>Login to your BloodBridge account</p>

            <form id="loginForm">

                <label for="loginEmail">Email</label>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

                <label for="loginPassword">Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">Login</button>

            </form>

            <p>
                Don't have an account?
                <a href="register.html">Register here</a>
            </p>

        </section>
    </main>

    <footer>
        <p>© 2026 BloodBridge | Connecting Donors with Those in Need</p>
    </footer>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;

            const savedUserText = localStorage.getItem("bloodBridgeUser");

            if (!savedUserText) {
                alert("Please register first.");
                return;
            }

            const savedUser = JSON.parse(savedUserText);

            if (
                email === savedUser.email &&
                password === savedUser.password
            ) {
                localStorage.setItem("bloodBridgeLoggedIn", "true");

                alert("Login successful! Welcome to BloodBridge.");

                window.location.href = "index.html";
            } else {
                alert("Incorrect email or password.");
            }
        });

        // Register service worker
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js");
        }
    </script>

</body>
</html>
