<section>

<h2>User Login</h2>
<form id="loginForm">

  <label>Email</label>
  <input type="email" id="loginEmail" placeholder="Enter your email" required>

  <label>Password</label>
  <input type="password" id="loginPassword" placeholder="Enter your password" required>

  <button type="submit">Login</button>

</form>

<h3 id="loginMessage"></h3>

</section>

<footer>
<p>Welcome to Blood Donation System ❤️</p>
</footer>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e){

e.preventDefault();

document.getElementById("loginMessage").innerHTML =
"✅ Login Successful!";

this.reset();

});
</script>
<script>
document.querySelector("form").addEventListener("submit", function(event) {
    event.preventDefault();

    const email = document.querySelector('input[type="email"]').value;
    const password = document.querySelector('input[type="password"]').value;

    const savedUser = JSON.parse(localStorage.getItem("bloodBridgeUser"));

    if (!savedUser) {
        alert("No account found. Please register first.");
        return;
    }

    if (email === savedUser.email && password === savedUser.password) {
        alert("Login successful! Welcome to BloodBridge.");
        window.location.href = "index.html";
    } else {
        alert("Incorrect email or password.");
    }
});
</script>
    <script>
document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    const savedUser = JSON.parse(localStorage.getItem("bloodBridgeUser"));

    if (!savedUser) {
        alert("No account found. Please register first.");
        return;
    }

    if (email === savedUser.email && password === savedUser.password) {
        localStorage.setItem("bloodBridgeLoggedIn", "true");

        alert("Login successful! Welcome to BloodBridge.");
        window.location.href = "index.html";
    } else {
        alert("Incorrect email or password.");
    }
});
                                                      </script>
